 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Assignment</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <div class="mail center">
        <img src="outlook image.avif" alt="mail">
        <h2>Check your email</h2>
        <p>Enter the six digit code we just sent to <b>amy.smith@zest.com</b> to continue</p>
        <input type="text" class = "email" placeholder="123456">
        <button>Continue</button>
    </div>

    <div class="welcome center">
        <img src="hi.webp" alt="welcome">
        <h2>Welcome Amy!</h2>
        <p>It's great to have you with us! To help us optimze your experience, tell us how you use OpenPhone</p>
        <button >Work</button>
        <button >Personal</button>
        <button >Continue</button>
    </div>

    <div class="number center">
        <img src="call.webp" alt="phone">
        <h2>Phone Number</h2>
        <p>Would you like a new OpenPhone number or want to port your existing number over?</p>
        <button >Brand new number</button>
        <button >Port existing number</button>
        <button>Continue</button>
    </div>

    
    
 </body>
 </html>
